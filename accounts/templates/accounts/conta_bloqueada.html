<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Conta Bloqueada — BarberLab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#080810; --bg-card:#0F0F1C; --bg-input:#1A1A2E;
      --p:#6366F1; --p2:#8B5CF6; --p-glow:rgba(99,102,241,.15); --p-glow-s:rgba(99,102,241,.35);
      --text:#F0F0F8; --text-2:#C0C0D8; --text-dim:#7070A0;
      --border:#1E1E32;
      --r:14px; --r2:10px;
      --font:'Outfit',system-ui,sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:var(--font); background:var(--bg); color:var(--text);
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:2rem 1rem; -webkit-font-smoothing:antialiased;
    }
    body::before{
      content:''; position:fixed; top:-200px; left:-150px;
      width:700px; height:700px;
      background:radial-gradient(circle,rgba(239,68,68,.1) 0%,transparent 70%);
      filter:blur(90px); pointer-events:none; z-index:0;
    }
    body::after{
      content:''; position:fixed; bottom:-300px; right:-200px;
      width:600px; height:600px;
      background:radial-gradient(circle,rgba(99,102,241,.08) 0%,transparent 65%);
      filter:blur(100px); pointer-events:none; z-index:0;
    }
    .wrapper{
      width:100%; max-width:460px;
      position:relative; z-index:1;
      text-align:center;
    }
    .logo-icon{
      width:56px; height:56px; border-radius:14px;
      background:linear-gradient(135deg,var(--p),var(--p2));
      display:inline-flex; align-items:center; justify-content:center;
      margin-bottom:1rem;
      box-shadow:0 8px 32px var(--p-glow-s);
    }
    .logo-name{
      font-size:1.8rem; font-weight:800; letter-spacing:-1px;
      background:linear-gradient(135deg,#fff,var(--p2));
      -webkit-background-clip:text; background-clip:text; color:transparent;
      display:block; margin-bottom:2rem;
    }
    .card{
      background:var(--bg-card); border:1px solid rgba(239,68,68,.2);
      border-radius:var(--r); padding:2.5rem 2rem;
      box-shadow:0 24px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(239,68,68,.05);
    }
    .block-icon{
      width:72px; height:72px; border-radius:50%;
      background:rgba(239,68,68,.1); border:1.5px solid rgba(239,68,68,.25);
      display:inline-flex; align-items:center; justify-content:center;
      margin-bottom:1.5rem;
    }
    h1{
      font-size:1.5rem; font-weight:800; margin-bottom:.75rem;
      color:var(--text);
    }
    .desc{
      color:var(--text-2); font-size:.95rem; line-height:1.7;
      margin-bottom:2rem;
    }
    .contact-box{
      background:rgba(99,102,241,.07); border:1px solid rgba(99,102,241,.15);
      border-radius:var(--r2); padding:1.25rem 1.5rem;
      margin-bottom:1.75rem; text-align:left;
    }
    .contact-box .label{
      font-size:.7rem; font-weight:700; color:var(--text-dim);
      text-transform:uppercase; letter-spacing:.6px; margin-bottom:.5rem;
    }
    .contact-box a{
      color:#A78BFA; font-weight:600; text-decoration:none; font-size:.95rem;
    }
    .contact-box a:hover{ color:var(--p2); }
    .btn-logout{
      width:100%; padding:.9rem;
      background:transparent; border:1.5px solid var(--border);
      border-radius:var(--r2); color:var(--text-dim);
      font-family:var(--font); font-size:.95rem; font-weight:600;
      cursor:pointer; transition:all .18s;
    }
    .btn-logout:hover{ border-color:#EF4444; color:#fca5a5; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div>
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:28px;height:28px"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
      </div>
      <span class="logo-name">BarberLab</span>
    </div>

    <div class="card">
      <div class="block-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:34px;height:34px"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>

      <h1>Conta bloqueada</h1>
      <p class="desc">
        O acesso à sua conta foi temporariamente bloqueado pelo administrador.<br>
      </p>

      <a href="{% url 'logout' %}">
        <button class="btn-logout">Sair da conta</button>
      </a>
    </div>
  </div>
</body>
</html>
