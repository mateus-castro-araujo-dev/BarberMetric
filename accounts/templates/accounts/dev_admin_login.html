<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dev Admin — BarberLab</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#04040a;--bg-card:#0a0a14;--p:#6366F1;--p2:#8B5CF6;--p3:#A78BFA;
      --p-glow-s:rgba(99,102,241,.35);--text:#F0F0F8;--text-2:#C0C0D8;--text-dim:#7070A0;
      --border:#1E1E32;--r:14px;--r2:10px;--font:'Outfit',system-ui,sans-serif;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;
      display:flex;align-items:center;justify-content:center;padding:2rem 1rem;}
    body::before{content:'';position:fixed;top:-200px;left:-150px;width:700px;height:700px;
      background:radial-gradient(circle,rgba(99,102,241,.18) 0%,transparent 70%);
      filter:blur(90px);pointer-events:none;}
    .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);
      padding:2.5rem 2rem;max-width:400px;width:100%;position:relative;z-index:1;
      box-shadow:0 24px 60px rgba(0,0,0,.6);}
    .badge{display:inline-flex;align-items:center;gap:.4rem;background:rgba(99,102,241,.1);
      border:1px solid rgba(99,102,241,.3);color:var(--p3);padding:.35rem .9rem;
      border-radius:999px;font-size:.75rem;font-weight:700;margin-bottom:1.5rem;}
    h1{font-size:1.5rem;font-weight:800;margin-bottom:.35rem;}
    p{color:var(--text-dim);font-size:.88rem;margin-bottom:1.75rem;}
    label{display:block;font-size:.72rem;font-weight:700;color:var(--text-dim);
      text-transform:uppercase;letter-spacing:.6px;margin-bottom:.45rem;}
    input[type=password]{width:100%;padding:.85rem 1rem;background:#11111e;
      border:1.5px solid var(--border);border-radius:var(--r2);color:var(--text);
      font-family:var(--font);font-size:.95rem;transition:border-color .15s;}
    input[type=password]:focus{outline:none;border-color:var(--p);}
    .error{color:#fca5a5;font-size:.82rem;margin-top:.5rem;}
    .btn{display:block;width:100%;padding:1rem;margin-top:1.25rem;border:none;
      border-radius:var(--r2);background:linear-gradient(135deg,var(--p),var(--p2));
      color:#fff;font-family:var(--font);font-weight:800;font-size:.95rem;cursor:pointer;
      transition:all .2s;}
    .btn:hover{transform:translateY(-1px);box-shadow:0 12px 32px var(--p-glow-s);}
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Acesso restrito
    </div>
    <h1>Painel do Dev</h1>
    <p>Área exclusiva para administração do sistema.</p>
    <form method="POST">
      {% csrf_token %}
      <label>Senha de desenvolvedor</label>
      <input type="password" name="secret" placeholder="••••••••••••" autofocus required>
      {% if erro %}<div class="error">{{ erro }}</div>{% endif %}
      <button type="submit" class="btn">Entrar</button>
    </form>
  </div>
</body>
</html>
