<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Barber Metric">
  <meta name="theme-color" content="#6366F1">
  <title>Login — Barber Metric</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#080810; --bg-card:#0F0F1C; --bg-input:#1A1A2E;
      --p:#6366F1; --p2:#8B5CF6; --p-glow:rgba(99,102,241,.15); --p-glow-s:rgba(99,102,241,.35);
      --text:#F0F0F8; --text-2:#C0C0D8; --text-dim:#7070A0;
      --border:#1E1E32; --border-2:#2A2A45;
      --r:14px; --r2:10px;
      --font:'Outfit',system-ui,sans-serif;
      --ease:cubic-bezier(.4,0,.2,1);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:var(--font); background:var(--bg); color:var(--text);
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:2rem 1rem; -webkit-font-smoothing:antialiased; overflow-x:hidden;
      line-height:1.5;
    }
    body::before{
      content:''; position:fixed; top:-200px; left:-150px;
      width:700px; height:700px;
      background:radial-gradient(circle,rgba(99,102,241,.22) 0%,rgba(139,92,246,.08) 45%,transparent 70%);
      filter:blur(90px); pointer-events:none; z-index:0;
    }
    body::after{
      content:''; position:fixed; bottom:-300px; right:-200px;
      width:600px; height:600px;
      background:radial-gradient(circle,rgba(139,92,246,.14) 0%,transparent 65%);
      filter:blur(100px); pointer-events:none; z-index:0;
    }
    .auth-wrapper{ width:100%; max-width:440px; position:relative; z-index:1; }
    .auth-logo{ text-align:center; margin-bottom:2rem; }
    .auth-logo .logo-icon{
      width:56px; height:56px; border-radius:14px;
      background:linear-gradient(135deg,var(--p),var(--p2));
      display:inline-flex; align-items:center; justify-content:center;
      font-size:1.6rem; margin-bottom:1rem;
      box-shadow:0 8px 32px var(--p-glow-s);
    }
    .auth-logo h1{
      font-size:2rem; font-weight:800; letter-spacing:-1px;
      background:linear-gradient(135deg,#fff,var(--p2));
      -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    .auth-logo p{ color:var(--text-dim); font-size:.9rem; margin-top:.3rem; }
    .auth-card{
      background:var(--bg-card); border:1px solid var(--border);
      border-radius:var(--r); padding:2.25rem 2rem;
      box-shadow:0 24px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(99,102,241,.04);
    }
    .auth-card h2{ font-size:1.3rem; font-weight:700; margin-bottom:1.75rem; color:var(--text); }
    .form-group{ margin-bottom:1.2rem; }
    .form-group label{
      display:block; font-size:.72rem; font-weight:700;
      color:var(--text-dim); margin-bottom:.5rem;
      text-transform:uppercase; letter-spacing:.6px;
    }
    .form-group input{
      width:100%; padding:.85rem 1rem;
      background:var(--bg-input); border:1.5px solid var(--border);
      border-radius:var(--r2); color:var(--text);
      font-size:.95rem; font-family:var(--font);
      transition:all .18s var(--ease);
    }
    .form-group input::placeholder{ color:var(--text-dim); opacity:.6; }
    .form-group input:focus{
      outline:none; border-color:var(--p);
      box-shadow:0 0 0 3px var(--p-glow); background:var(--bg-card);
    }
    .btn-primary{
      width:100%; padding:.95rem;
      background:linear-gradient(135deg,var(--p),var(--p2));
      color:#fff; font-weight:700; font-size:1rem;
      border:none; border-radius:var(--r2);
      cursor:pointer; transition:all .2s var(--ease);
      margin-top:.5rem; font-family:var(--font); letter-spacing:.3px;
    }
    .btn-primary:hover{ transform:translateY(-1px); box-shadow:0 10px 30px var(--p-glow-s); }
    .alert{
      padding:.8rem 1rem; border-radius:var(--r2);
      margin-bottom:1.25rem; font-size:.88rem;
    }
    .alert-error{ background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.25); color:#fca5a5; }
    .alert-success{ background:rgba(16,185,129,.1); border:1px solid rgba(16,185,129,.25); color:#6ee7b7; }
    .auth-footer{ text-align:center; margin-top:1.5rem; color:var(--text-dim); font-size:.9rem; }
    .auth-footer a{ color:var(--p3,#A78BFA); text-decoration:none; font-weight:600; }
    .auth-footer a:hover{ color:var(--p2); }
  </style>
</head>
<body>
  {% load static %}
  <div class="auth-wrapper">
    <div class="auth-logo">
      <span class="logo-icon"><img src="{% static 'img/icon-192.png' %}" alt="Barber Metric" style="width:40px;height:40px;object-fit:cover;border-radius:8px;"></span>
      <h1>Barber Metric</h1>
      <p>O sistema profissional para sua barbearia</p>
    </div>

    <div class="auth-card">
      <h2>Entrar na conta</h2>

      {% if erro %}<div class="alert alert-error"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;vertical-align:-3px;margin-right:.4rem"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>{{ erro }}</div>{% endif %}
      {% if messages %}{% for msg in messages %}<div class="alert alert-success"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;vertical-align:-3px;margin-right:.4rem"><polyline points="20 6 9 17 4 12"/></svg>{{ msg }}</div>{% endfor %}{% endif %}

      <form method="POST">
        {% csrf_token %}
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" name="email" placeholder="seu@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" name="senha" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary">Entrar</button>
      </form>
      <div style="text-align:center; margin-top:1.1rem;">
        <a href="{% url 'esqueci_senha' %}" style="color:var(--text-dim); font-size:.85rem; text-decoration:none;">Esqueci minha senha</a>
      </div>
    </div>

    <div class="auth-footer">
      Não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se grátis por 30 dias</a>
    </div>
  </div>
</body>
</html>
