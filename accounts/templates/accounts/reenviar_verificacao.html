<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reenviar verificação — BarberLab</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#080810;--bg-card:#0F0F1C;--p:#6366F1;--p2:#8B5CF6;--p3:#A78BFA;
      --p-glow-s:rgba(99,102,241,.35);--text:#F0F0F8;--text-2:#C0C0D8;--text-dim:#7070A0;
      --border:#1E1E32;--r:14px;--r2:10px;--font:'Outfit',system-ui,sans-serif;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;
      display:flex;align-items:center;justify-content:center;padding:2rem 1rem;
      -webkit-font-smoothing:antialiased;}
    body::before{content:'';position:fixed;top:-200px;left:-150px;width:700px;height:700px;
      background:radial-gradient(circle,rgba(99,102,241,.22) 0%,transparent 70%);
      filter:blur(90px);pointer-events:none;z-index:0;}
    .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);
      padding:2.5rem 2rem;max-width:440px;width:100%;text-align:center;position:relative;z-index:1;}
    h1{font-size:1.4rem;font-weight:800;margin-bottom:.75rem;}
    p{color:var(--text-2);font-size:.93rem;line-height:1.65;margin-bottom:1.25rem;}
    .btn{display:block;width:100%;padding:1rem;border-radius:var(--r2);border:none;
      font-family:var(--font);font-weight:700;font-size:.95rem;cursor:pointer;
      background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;
      transition:all .2s;}
    .btn:hover{transform:translateY(-1px);box-shadow:0 12px 32px var(--p-glow-s);}
    .link{display:block;margin-top:1rem;color:var(--p3);font-size:.88rem;text-decoration:none;}
    .link:hover{color:var(--p2);}
  </style>
</head>
<body>
  <div class="card">
    <h1>Reenviar e-mail</h1>
    <p>Clique abaixo para receber um novo link de confirmação no e-mail <strong style="color:var(--p3)">{{ barbearia.user.email }}</strong>.</p>
    <form method="POST">
      {% csrf_token %}
      <button type="submit" class="btn">Enviar novo link</button>
    </form>
    <a href="{% url 'home' %}" class="link">← Voltar ao sistema</a>
  </div>
</body>
</html>
