<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="glow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1C0E3C" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="roundrect">
      <rect width="32" height="32" rx="7" ry="7"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" ry="7" fill="#1C0E3C"/>
  <!-- Glow -->
  <rect width="32" height="32" rx="7" ry="7" fill="url(#glow)"/>

  <g clip-path="url(#roundrect)">
    <!-- Left razor -->
    <rect x="4" y="14.5" width="13" height="3.2" rx="1.2"
          fill="white" opacity="0.95"
          transform="rotate(-42 10 16)"/>
    <!-- Right razor -->
    <rect x="15" y="14.5" width="13" height="3.2" rx="1.2"
          fill="white" opacity="0.95"
          transform="rotate(42 22 16)"/>
    <!-- Pole body -->
    <rect x="14" y="5" width="4" height="22" rx="2" fill="white"/>
    <!-- Stripes -->
    <rect x="14" y="5" width="4" height="22" rx="2" fill="none"
          stroke="#3B0F8E" stroke-width="1.5"
          stroke-dasharray="3 3.5"
          stroke-dashoffset="0"/>
    <!-- Ball top -->
    <circle cx="16" cy="5" r="2.8" fill="white"/>
    <!-- Base cap -->
    <rect x="12.5" y="25.5" width="7" height="2.2" rx="1" fill="white"/>
  </g>
</svg>
